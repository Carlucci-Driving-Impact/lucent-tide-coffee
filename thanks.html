<style>
body{background:var(--dsb-2)}
.ty{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#fff;isolation:isolate;padding:calc(2rem + env(safe-area-inset-top)) 1.25rem calc(5rem + env(safe-area-inset-bottom))}
.ty video,.ty .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ty .poster{background:url(assets/hero-poster.jpg) center/cover}
.ty video{opacity:0;transition:opacity 1.4s var(--ease);object-position:50% 40%}
.ty video.on{opacity:1}
.ty .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,32,38,.6),rgba(20,32,38,.42) 40%,rgba(20,32,38,.82))}
.ty-inner{width:min(640px,100%);display:flex;flex-direction:column;align-items:center;gap:1.6rem;text-align:center}
.ty .lockup{width:min(300px,62vw);color:#fff;filter:drop-shadow(0 6px 24px rgba(10,20,25,.45));opacity:0;animation:up 1.1s var(--ease) .15s forwards}
.card{width:100%;background:rgba(250,248,243,.97);color:var(--dsb);border-radius:28px;padding:clamp(1.8rem,5vw,2.8rem);box-shadow:0 40px 90px -30px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;gap:1.1rem;opacity:0;animation:up 1s var(--ease) .45s forwards;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--dsb),var(--sb),var(--sb-soft))}
.tick{width:84px;height:84px}
.tick circle{fill:none;stroke:var(--sb-soft);stroke-width:2;stroke-dasharray:252;stroke-dashoffset:252;animation:draw 1s var(--ease) .9s forwards}
.tick path{fill:none;stroke:var(--dsb);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s var(--ease) 1.6s forwards}
.card h1{font-family:var(--font-display);font-weight:500;font-size:clamp(2.1rem,6vw,3.1rem);line-height:1.05;color:var(--dsb);text-wrap:balance}
.card h1 em{font-style:italic;color:var(--sb)}
.card .lede{margin:0 auto;text-align:center}
.picks{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.picks span{font-size:.82rem;font-weight:700;letter-spacing:.04em;padding:.5rem .9rem;border-radius:999px;background:var(--mist);color:var(--dsb);border:1px solid var(--line)}
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;width:100%;margin-top:.4rem}
.next div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.9rem .7rem}
.next b{display:block;font-family:var(--font-display);font-weight:500;font-size:1.15rem}
.next small{font-size:.78rem;color:var(--muted)}
.ctas{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;opacity:0;animation:up 1s var(--ease) .75s forwards}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:80px;color:var(--cream);z-index:0}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:520px){.ty .lockup{width:min(210px,56vw)}.ty-inner{gap:1.2rem}.next{gap:.45rem}.next div{padding:.7rem .4rem}.next b{font-size:.98rem}.next small{font-size:.7rem}.ctas .btn{width:100%}.tick{width:68px;height:68px}}
@media (prefers-reduced-motion:reduce){.ty .lockup,.card,.ctas{animation:none;opacity:1}.tick circle,.tick path{animation:none;stroke-dashoffset:0}}
</style>

<script>
(() => {
  const v = document.getElementById('v');
  const on = () => v.classList.add('on');
  v.addEventListener('playing', on, { once: true });
  v.play && v.play().then(on).catch(() => {});
  ['touchstart','click'].forEach(e => addEventListener(e, () => v.play().then(on).catch(() => {}), { once: true, passive: true }));
  let d = null; try { d = JSON.parse(sessionStorage.getItem('lt_prereg') || 'null'); } catch (_) {}
  if (!d) return;
  const names = { yoga: 'Waterfront Yoga', paddleboard: 'Paddle Board Rentals', kayak: 'Kayak Rentals' };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const first = d.name ? d.name.split(/\s+/)[0] : '';
  if (first) document.getElementById('h').innerHTML = `Thank you, <em>${esc(first)}.</em>`;
  const picks = (d.interests || []).filter(k => names[k]);
  if (picks.length) {
    const list = picks.map(k => names[k]);
    const txt = list.length === 1 ? list[0] : list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];

    const el = document.getElementById('picks'); el.hidden = false;
    el.innerHTML = list.map(n => `<span>${esc(n)}</span>`).join('');
  }
